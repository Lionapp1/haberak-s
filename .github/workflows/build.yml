name: Build & Sign APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Prepare signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            {
              echo "KEYSTORE_FILE=/tmp/release.keystore"
              echo "KEYSTORE_PASSWORD=$SIGNING_KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$SIGNING_KEY_ALIAS"
              echo "KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
            } > keystore.properties
          else
            echo "::warning::Ä°mza secret'larÄ± yok â geÃ§ici keystore Ã¼retiliyor."
            keytool -genkeypair -v -keystore /tmp/release.keystore -alias filebeam \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass filebeam123 -keypass filebeam123 \
              -dname "CN=FileBeam, OU=Lion, O=Lion, L=Istanbul, S=Istanbul, C=TR"
            {
              echo "KEYSTORE_FILE=/tmp/release.keystore"
              echo "KEYSTORE_PASSWORD=filebeam123"
              echo "KEY_ALIAS=filebeam"
              echo "KEY_PASSWORD=filebeam123"
            } > keystore.properties
          fi

      - name: Build release APK
        run: |
          gradle assembleRelease --stacktrace 2>&1 | tee build.log
          grep -E "^e: |error:" build.log | head -50 | while IFS= read -r l; do echo "::error::$l"; done
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FileBeam-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build.log
