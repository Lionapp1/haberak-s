name: Build & Sign APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "Gerçek release anahtarı kullanılıyor."
          else
            echo "Secret yok: geçici imza anahtarı oluşturuluyor (yalnızca test için)."
            keytool -genkey -v -keystore "$GITHUB_WORKSPACE/release.keystore" \
              -alias haberakisi -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass haberakisi -keypass haberakisi \
              -dname "CN=HaberAkisi, OU=Dev, O=Lion, C=TR"
          fi
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
          {
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-haberakisi}"
            echo "KEY_ALIAS=${KEY_ALIAS:-haberakisi}"
            echo "KEY_PASSWORD=${KEY_PASSWORD:-haberakisi}"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaberAkisi-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
