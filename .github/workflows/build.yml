name: Build & Sign APK

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Validate persistent release-signing secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for key in SIGNING_KEYSTORE_BASE64 SIGNING_KEYSTORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $key"
              echo "::error::A temporary keystore is intentionally not generated because it breaks install-over-update."
              exit 1
            fi
          done
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/filebeam-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/filebeam-release.keystore" \
            -storepass "$SIGNING_KEYSTORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/filebeam-release.keystore"
            echo "KEYSTORE_PASSWORD=$SIGNING_KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$SIGNING_KEY_ALIAS"
            echo "KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleRelease --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload signed APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: FileBeam-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/
          if-no-files-found: ignore
